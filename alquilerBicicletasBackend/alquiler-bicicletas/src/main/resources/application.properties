# ==============================
# \uD83E\uDDE9 Configuraci\u00F3n general
# ==============================

spring.application.name=alquiler-bicicletas
server.port=8085
server.address=0.0.0.0
spring.mandatory-file-encoding=UTF-8

# ==============================
# \uD83D\uDD17 Configuraci\u00F3n de Base de Datos (PostgreSQL)
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=alquiler_bicicletas
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.encoding=UTF-8

# HikariCP (pool de conexiones)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ==============================
# \u2699\uFE0F JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=alquiler_bicicletas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# \uD83D\uDE80 Flyway
# ==============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=alquiler_bicicletas
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-on-validation-error=false
spring.flyway.user=admin
spring.flyway.password=admin
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=alquiler_bicicletas
spring.flyway.placeholders.schema=alquiler_bicicletas
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history
spring.flyway.ignore-migration-patterns=*:pending
spring.flyway.postgresql-compatibility-fix=true

# ==============================
# \uD83D\uDCE7 Email (Gmail)
# ==============================
# ==============================
# \uD83D\uDCE7 Email (Gmail) - CONFIGURACI\u00D3N COMPLETA
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= i@bikerental.com.es
spring.mail.password=ahca kxpn hkqw sdig
# Nombre del remitente para emails
app.email.sender.name=Bike Rental

# Propiedades SMTP cr\u00EDticas para deliverability
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# IMPORTANTE: Configuraci\u00F3n para mejorar reputaci\u00F3n
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Headers importantes para Outlook/Microsoft
spring.mail.properties.mail.smtp.sendpartial=true
spring.mail.properties.mail.smtp.allow8bitmime=true

# From address configuration
spring.mail.properties.from= i@bikerental.com.es

# ==============================
# \uD83D\uDCC4 Contratos PDF
# ==============================

# Producci\u00F3n (Linux)
# app.contratos.path=/opt/alquiler-bicicletas/contratos

# Desarrollo local (Windows/macOS/Linux)
app.contratos.path=./contratos
app.contratos.url-base=http://localhost:8085/contratos



# ==============================
# \uD83C\uDF10 URLs
# ==============================

# Backend para enlaces de cancelaci\u00F3n
frontend.base-url=http://localhost:8085
#frontend.base-url=http://localhost:4200

# Frontend Angular
app.frontend.url=http://localhost:4200

# ==============================
# \uD83D\uDCE6 Recursos est\u00E1ticos
# ==============================

spring.web.resources.static-locations=classpath:/static/

# ==============================
# \uD83E\uDDEA Logging y Debug
# ==============================

management.endpoints.web.exposure.include=*
management.endpoint.mappings.access=read_only

logging.level.org.springframework.jdbc.core=TRACE
logging.level.org.flywaydb.core.internal.command=DEBUG
logging.level.org.flywaydb.core.internal.database=DEBUG






# ===== Backups =====
app.backup.enabled=true
# Cron: todos los d\u00EDas a las 03:30
app.backup.cron=0 30 3 * * *
# Carpeta donde guardar los backups (relativa al proyecto o absoluta)
app.backup.dir=./backups
# D\u00EDas a conservar
app.backup.keep-days=14

# Si tu pg_dump no est\u00E1 en el PATH, pon la ruta completa:
# Windows (ejemplo):
# app.backup.pgDumpPath=C:/Program Files/PostgreSQL/16/bin/pg_dump.exe
# Linux:
# app.backup.pgDumpPath=/usr/bin/pg_dump
# Por defecto, intentar\u00E1 usar "pg_dump" del PATH
app.backup.pgDumpPath=pg_dump

# Incluir ficheros adicionales en el backup
app.backup.include-contratos=true
app.backup.contratos.path=${app.contratos.path}
app.backup.include-documentos=true
app.backup.documentos.path=${app.uploads.documentos.path}

# Im\u00E1genes de bicicletas
app.uploads.bicicletas.path=./uploads/bicicletas
app.uploads.bicicletas.url-base=/imagenes/bicicletas


# Subidas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.documentos.path=./uploads/documentos
app.uploads.documentos.url-base=/documentos

