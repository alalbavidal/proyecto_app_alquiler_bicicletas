# ==============================
#  Configuración general
# ==============================
spring.application.name=alquiler-bicicletas
server.port=8085
server.address=0.0.0.0
spring.mandatory-file-encoding=UTF-8

# ==============================
#  Configuración de Base de Datos (PostgreSQL)
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.encoding=UTF-8

# HikariCP (pool de conexiones)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ==============================
#  JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=alquiler_bicicletas

# ==============================
#  Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=alquiler_bicicletas
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-on-validation-error=false
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.url=${DB_URL}
spring.flyway.placeholders.schema=alquiler_bicicletas
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history
spring.flyway.ignore-migration-patterns=*:pending
spring.flyway.postgresql-compatibility-fix=true

# ==============================
#  Email (Gmail)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.email.sender.name=Bike Rental

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.sendpartial=true
spring.mail.properties.mail.smtp.allow8bitmime=true
spring.mail.properties.from=${MAIL_USERNAME}

# ==============================
#  Contratos PDF
# ==============================
app.contratos.path=/opt/alquiler-bicicletas/contratos
app.contratos.url-base=${APP_BASE_URL}/contratos

# ==============================
#  URLs
# ==============================
frontend.base-url=${APP_BASE_URL}
app.frontend.url=${FRONTEND_URL}

# ==============================
#  Recursos estáticos
# ==============================
spring.web.resources.static-locations=classpath:/static/

# ==============================
# Logging y Debug
# ==============================
management.endpoints.web.exposure.include=health,info
management.endpoint.mappings.access=read_only
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.flywaydb.core.internal.command=WARN
logging.level.org.flywaydb.core.internal.database=WARN

# ==============================
#  Backups
# ==============================
app.backup.enabled=true
app.backup.cron=0 30 3 * * *
app.backup.dir=/opt/alquiler-bicicletas/backups
app.backup.keep-days=14
app.backup.pgDumpPath=/usr/bin/pg_dump
app.backup.include-contratos=true
app.backup.contratos.path=${app.contratos.path}
app.backup.include-documentos=true
app.backup.documentos.path=${app.uploads.documentos.path}

# ==============================
#  Imágenes y subidas
# ==============================
app.uploads.bicicletas.path=/opt/alquiler-bicicletas/uploads/bicicletas
app.uploads.bicicletas.url-base=/imagenes/bicicletas
app.uploads.documentos.path=/opt/alquiler-bicicletas/uploads/documentos
app.uploads.documentos.url-base=/documentos

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB