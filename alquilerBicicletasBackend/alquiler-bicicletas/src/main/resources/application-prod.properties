# ==============================
# \uD83E\uDDE9 Configuraci\u00F3n general
# ==============================

spring.application.name=alquiler-bicicletas
server.port=8080
spring.mandatory-file-encoding=UTF-8

# ==============================
# \uD83D\uDD17 Configuraci\u00F3n de Base de Datos (PostgreSQL)
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=alquiler_bicicletas
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.encoding=UTF-8

# HikariCP (pool de conexiones)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000

# ==============================
# \u2699\uFE0F JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=alquiler_bicicletas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# \uD83D\uDE80 Flyway
# ==============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=alquiler_bicicletas
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-on-validation-error=false
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=alquiler_bicicletas
spring.flyway.placeholders.schema=alquiler_bicicletas
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history
spring.flyway.ignore-migration-patterns=*:pending
spring.flyway.postgresql-compatibility-fix=true

# ==============================
# \uD83D\uDCE7 Email (producci\u00F3n - Gmail u otro proveedor SMTP)
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# \uD83D\uDCC4 Contratos PDF (producci\u00F3n)
# ==============================

app.contratos.path=/opt/alquiler-bicicletas/contratos

# ==============================
# \uD83C\uDF10 URLs (producci\u00F3n)
# ==============================

frontend.base-url=https://www.bikerental.com.es/
app.frontend.url=https://alquilerbici.com

# ==============================
# \uD83D\uDCE6 Recursos est\u00E1ticos
# ==============================

spring.web.resources.static-locations=classpath:/static/

# ==============================
# \uD83E\uDDEA Logging (producci\u00F3n)
# ==============================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.flywaydb.core=INFO
