# ==============================
# 🧩 Configuración general
# ==============================

spring.application.name=alquiler-bicicletas
server.port=8085
server.address=0.0.0.0
spring.mandatory-file-encoding=UTF-8

# ==============================
# 🔗 Base de datos (PostgreSQL)
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=alquiler_bicicletas
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ==============================
# ⚙️ JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=alquiler_bicicletas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# 🚀 Flyway
# ==============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=alquiler_bicicletas
spring.flyway.baseline-on-migrate=true

# ==============================
# 📧 Email (Gmail)
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.email.sender.name=Bike Rental

# ==============================
# 🌐 Frontend
# ==============================

app.frontend.url=http://localhost:4200