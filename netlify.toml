[build]
  base = "alquilerBicicletasFrontend"
  command = "npm run build"
  publish = "dist/alquiler-bicicletas-fronted/browser"  

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "http://localhost:8085/api/:splat"
  status = 200