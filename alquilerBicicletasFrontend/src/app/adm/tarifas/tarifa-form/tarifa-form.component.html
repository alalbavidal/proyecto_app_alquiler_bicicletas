<!-- src/app/adm/tarifas/tarifa-form/tarifa-form.component.html -->
<div class="card">
  <div class="card__header">
    <h2>{{ id ? 'Editar tarifa' : 'Nueva tarifa' }}</h2>
  </div>

  <div class="card__body">
    <div *ngIf="loading">Cargando…</div>
    <div *ngIf="error" class="alert alert--error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
      <div class="grid">
        <label>
          <span>Nombre *</span>
          <input formControlName="nombre" type="text" />
        </label>

        <label>
          <span>Descripción *</span>
          <input formControlName="descripcion" type="text" />
        </label>

        <label>
          <span>Precio (€) *</span>
          <input formControlName="precio" type="number" step="0.01" />
        </label>

        <label>
          <span>Tipo</span>
          <select formControlName="precioPorDia">
            <option [ngValue]="false">Por horas</option>
            <option [ngValue]="true">Por día(s)</option>
          </select>
        </label>

        <!-- Modo POR HORAS -->
        <ng-container *ngIf="!form.value.precioPorDia">
          <label>
            <span>Horas incluidas</span>
            <input formControlName="horasIncluidas" type="number" />
          </label>
          <label>
            <span>Hora inicio (opcional)</span>
            <input formControlName="horaInicio" type="time" />
          </label>
          <label>
            <span>Hora fin (opcional)</span>
            <input formControlName="horaFin" type="time" />
          </label>
        </ng-container>

        <!-- Modo POR DÍA -->
        <ng-container *ngIf="form.value.precioPorDia">
          <label>
            <span>Días mínimos *</span>
            <input formControlName="diasMinimos" type="number" />
          </label>
          <label>
            <span>Hora de referencia (opcional)</span>
            <input formControlName="horaInicio" type="time" />
          </label>
          <label>
            <span>Hora fin (opcional)</span>
            <input formControlName="horaFin" type="time" />
          </label>
        </ng-container>

        <label>
          <span>Activa</span>
          <select formControlName="activa">
            <option [ngValue]="true">Sí</option>
            <option [ngValue]="false">No</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
