<p>accesorio-form works!</p>
<div class="card">
  <div class="card__header">
    <h2>{{ id ? 'Editar accesorio' : 'Nuevo accesorio' }}</h2>
  </div>

  <div class="card__body">
    <div *ngIf="loading">Cargando…</div>
    <div *ngIf="error" class="alert alert--error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
      <div class="grid">
        <label>
          <span>Nombre *</span>
          <input formControlName="nombre" type="text" />
        </label>

        <label>
          <span>Precio/día *</span>
          <input formControlName="precioDia" type="number" step="0.01" min="0" />
        </label>

        <label>
          <span>Stock *</span>
          <input formControlName="stock" type="number" min="0" />
        </label>

        <label class="col-span-2">
          <span>Descripción</span>
          <textarea formControlName="descripcion" rows="3"></textarea>
        </label>

        <label class="col-span-2">
          <span>Observaciones</span>
          <textarea formControlName="observaciones" rows="2"></textarea>
        </label>

        <label>
          <span>Activo</span>
          <select formControlName="activo">
            <option [value]="true">Sí</option>
            <option [value]="false">No</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
