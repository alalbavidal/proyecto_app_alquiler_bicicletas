<div class="p-4 max-w-md mx-auto bg-gray-50 rounded-lg shadow-lg">


  <app-calendario-reserva
    [diasNoDisponibles]="diasNoDisponibles"
    (fechaSeleccionada)="onFechaSeleccionada($event)"
  >
  </app-calendario-reserva>

  <div *ngIf="fechaSeleccionada" class="mt-4 p-4 bg-white rounded shadow">
    <h3 class="text-lg font-semibold">Fecha seleccionada:</h3>
    <p>{{ fechaSeleccionada | date: 'fullDate' }}</p>

    <!-- Selector de tarifa -->
    <app-selector-tarifa
      *ngIf="tarifasDisponibles.length > 0"
      [tarifas]="tarifasDisponibles"
      (tarifaSeleccionadaChange)="onTarifaSeleccionada($event)">
    </app-selector-tarifa>

    <!-- Selector de bicicletas: solo si están cargadas -->
    <app-selector-bicicleta
      *ngIf="bicicletasCargadas && bicicletasParaSelector.length > 0"
      [bicicletas]="bicicletasParaSelector"
      (bicicletasSeleccionadas)="onBicicletasSeleccionadas($event)">
    </app-selector-bicicleta>

    <!-- Selector de accesorios: solo si están cargados -->
    <app-selector-accesorio
      [accesorios]="accesoriosDisponibles"
      [maxCantidad]="bicicletasSeleccionadas.length"
      [maxPorAccesorio]="maxPorAccesorio"
      (accesoriosSeleccionados)="onAccesoriosSeleccionados($event)">
    </app-selector-accesorio>

    <!-- Cliente form -->
    <div *ngIf="bicicletasSeleccionadas.length > 0">
      <app-cliente-form (clienteConfirmado)="onClienteConfirmado($event)"></app-cliente-form>
    </div>

    <!-- NUEVO: Selector de idioma del contrato - solo cuando el cliente está confirmado -->
    <div *ngIf="cliente" class="mb-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
      <h3 class="text-lg font-semibold text-blue-800 mb-2">Idioma del contrato / Contract Language</h3>
      <div class="flex space-x-4">
        <button
          (click)="cambiarIdioma('es')"
          [class]="idiomaContrato === 'es'
            ? 'bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow'
            : 'bg-white text-blue-600 border border-blue-300 px-4 py-2 rounded-lg font-medium hover:bg-blue-50'">
          🇪🇸 Español
        </button>
        <button
          (click)="cambiarIdioma('en')"
          [class]="idiomaContrato === 'en'
            ? 'bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow'
            : 'bg-white text-blue-600 border border-blue-300 px-4 py-2 rounded-lg font-medium hover:bg-blue-50'">
          🇬🇧 English
        </button>
      </div>
      <p class="text-sm text-blue-600 mt-2">
        {{ idiomaContrato === 'es'
        ? 'El contrato y el email de confirmación se enviarán en el idioma seleccionado.'
        : 'The contract and confirmation email will be sent in the selected language.' }}
      </p>
    </div>

    <!-- Resumen reserva, solo si cliente ya confirmó sus datos -->
    <app-resumen-reserva
      *ngIf="cliente"
      [fecha]="fechaSeleccionada"
      [tarifa]="tarifaSeleccionada"
      [bicicletas]="bicicletasSeleccionadas"
      [accesorios]="accesoriosSeleccionados"
      (confirmarReserva)="onConfirmarReserva()">
    </app-resumen-reserva>
  </div>
</div>
<app-toast #toast (action)="onToastAction()"></app-toast>
