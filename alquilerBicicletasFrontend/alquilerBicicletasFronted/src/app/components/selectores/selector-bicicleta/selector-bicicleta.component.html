<!-- selector-bicicleta.component.html -->
<div style="border: 2px solid red; padding: 10px; margin: 10px 0; background: white;">
  
  <h3 style="font-weight: bold; margin-bottom: 10px;">Selecciona bicicletas</h3>
  
  <!-- Contador -->
  <div style="margin-bottom: 10px; padding: 5px; background: #f0f0f0;">
    <span *ngIf="seleccion.size === 0" style="color: #b45309;">
      ⚠️ Selecciona al menos una bicicleta
    </span>
    <span *ngIf="seleccion.size > 0" style="color: #16a34a;">
      ✅ {{ seleccion.size }} bicicleta(s) seleccionada(s)
    </span>
  </div>

  <!-- Lista -->
  <div *ngFor="let bici of bicicletas" style="border: 1px solid #ccc; padding: 5px; margin: 5px 0;">
    <label>
      <input
        type="checkbox"
        [checked]="seleccion.has(bici.id)"
        (change)="toggleSeleccion(bici)"
      />
      {{ bici.modelo }} - {{ bici.tipo }} - Nº {{ bici.numero }} - {{ bici.precioDia }}€
    </label>
  </div>
  
   </div>
